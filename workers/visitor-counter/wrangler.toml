name = "sanctuary-rocks-visitors"
main = "worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[kv_namespaces]]
binding = "VISITORS"
id = "b5d3e5a1da5c448a8eea382af865edb5"
